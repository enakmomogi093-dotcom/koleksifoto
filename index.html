<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koleksi Foto</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee}
header{padding:20px;text-align:center}
h1{margin:0 0 4px;font-size:1.5rem}
p.sub{margin:0;color:#9aa}
.admin{max-width:520px;margin:0 auto 16px;padding:14px;background:#1a1d24;border-radius:12px;display:flex;flex-wrap:wrap;gap:8px}
.admin input[type=password]{flex:1 1 100%;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee}
.admin input[type=file]{flex:1 1 100%;color:#9aa}
button{padding:10px 14px;border:0;border-radius:8px;background:#4f8cff;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#msg{flex:1 1 100%;font-size:.9rem;color:#9aa;min-height:1.2em}
.grid{column-width:170px;column-gap:10px;padding:0 12px 30px;max-width:1100px;margin:auto}
.card{position:relative;break-inside:avoid;margin-bottom:10px;border-radius:16px;overflow:hidden;background:#1a1d24}
.card img{width:100%;height:auto;display:block;cursor:zoom-in;min-height:80px}
.card button{position:absolute;right:8px;bottom:8px;padding:8px 12px;font-size:.8rem;border-radius:20px;background:#e60023}
#lb button{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#e60023;border-radius:24px;padding:12px 20px}
#empty{text-align:center;color:#9aa;padding:40px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:95vw;max-height:92vh}
</style>
</head>
<body>
<header>
  <h1>📸 Koleksi Foto</h1>
  <p class="sub">Ketuk foto untuk memperbesar, tekan Download untuk menyimpan.</p>
</header>

<div class="admin" id="admin">
  <input type="password" id="pw" placeholder="Password admin (khusus pemilik untuk upload)">
  <input type="file" id="files" accept="image/*" multiple>
  <button id="up">Upload ke GitHub</button>
  <span id="msg"></span>
</div>

<div class="grid" id="grid"></div>
<div id="empty" hidden>Belum ada foto.</div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""><button id="lbdl">⬇ Download</button></div>

<script>
const $ = id => document.getElementById(id);
$('pw').value = sessionStorage.getItem('pw') || '';

async function load() {
  try {
    const r = await fetch('/api/photos');
    const list = await r.json();
    if (!r.ok) throw new Error(list.error);
    $('grid').innerHTML = '';
    $('empty').hidden = list.length > 0;
    list.forEach(p => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<img loading="lazy" src="${p.url}" alt="foto"><button>⬇ Download</button>`;
      d.querySelector('img').onclick = () => { $('lbimg').src = p.url; $('lbdl').onclick = e => { e.stopPropagation(); download(p); }; $('lb').style.display = 'flex'; };
      d.querySelector('button').onclick = () => download(p);
      $('grid').appendChild(d);
    });
  } catch (e) { $('empty').hidden = false; $('empty').textContent = 'Gagal memuat: ' + e.message; }
}

async function download(p) {
  const b = await (await fetch(p.url)).blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = p.name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

$('up').onclick = async () => {
  const files = [...$('files').files];
  const password = $('pw').value;
  if (!files.length) return $('msg').textContent = 'Pilih foto dulu.';
  if (!password) return $('msg').textContent = 'Isi password admin.';
  sessionStorage.setItem('pw', password);
  $('up').disabled = true;
  let ok = 0;
  for (const [i, f] of files.entries()) {
    $('msg').textContent = `Mengupload ${i + 1}/${files.length}...`;
    try {
      const image = await compress(f);
      const r = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, image })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      ok++;
    } catch (e) { $('msg').textContent = 'Gagal: ' + e.message; break; }
  }
  if (ok === files.length) $('msg').textContent = `✅ ${ok} foto tersimpan ke GitHub.`;
  $('files').value = '';
  $('up').disabled = false;
  setTimeout(load, 1500);
};

load();
</script>
</body>
</html>
